<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตะกร้า - Luxe Bag</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <h1 class="logo">Luxe Bag</h1>
                <ul class="nav-links">
                    <li><a href="index.html">หน้าแรก</a></li>
                    <li><a href="product.html">สินค้า</a></li>
                    <li><a href="cart.html">ตะกร้า</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="cart-section">
            <div class="container">
                <h1>ตะกร้าของคุณ</h1>
                
                <div class="cart-content">
                    <div class="cart-items" id="cart-items">
                        <!-- Cart items will be loaded here by JavaScript -->
                    </div>
                    
                    <div class="cart-summary">
                        <h3>สรุปการสั่งซื้อ</h3>
                        <div class="summary-row">
                            <span>รวมทั้งหมด:</span>
                            <span id="total-price">฿0.00</span>
                        </div>
                        <button class="btn btn-primary btn-checkout">ดำเนินการชำระเงิน</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Luxe Bag. สงวนลิขสิทธิ์ทั้งหมด</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>

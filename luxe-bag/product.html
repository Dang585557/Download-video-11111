<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Detail</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- 🔝 HEADER -->
<header class="header">
  <div class="logo">LUXE BAG</div>
  <nav>
    <a href="index.html">หน้าแรก</a>
    <a href="#">สินค้า</a>
  </nav>
</header>

<!-- 👜 PRODUCT DETAIL -->
<section class="product-detail">

  <div class="product-container">

    <!-- รูปสินค้า -->
    <div class="product-images">
      <img id="main-image" src="images/gucci.jpg">
      <div class="thumbs">
        <img src="images/gucci.jpg" onclick="changeImage(this)">
        <img src="images/dior.jpg" onclick="changeImage(this)">
        <img src="images/chanel.jpg" onclick="changeImage(this)">
      </div>
    </div>

    <!-- รายละเอียด -->
    <div class="product-info">
      <h1>Gucci Marmont Bag</h1>
      <p class="price">฿49,000</p>

      <p>สภาพ: มือสอง สวย 95%</p>
      <p>อุปกรณ์: ถุงผ้า + กล่อง</p>

      <!-- 🎨 สี -->
      <label>เลือกสี:</label>
      <select id="color">
        <option>ดำ</option>
        <option>แดง</option>
        <option>น้ำตาล</option>
      </select>

      <!-- 🔢 จำนวน -->
      <label>จำนวน:</label>
      <input type="number" id="qty" value="1" min="1">

      <!-- 🛒 ปุ่ม -->
      <div class="buttons">
        <button onclick="addToCart('Gucci Marmont')">เพิ่มลงตะกร้า</button>
        <button class="buy">ซื้อทันที</button>
      </div>

      <p class="stock">สินค้าคงเหลือ: 3 ชิ้น</p>

    </div>

  </div>

</section>

<!-- 🛒 CART -->
<section class="cart-box">
  <h2>ตะกร้า</h2>
  <ul id="cart-list"></ul>
</section>

<footer class="footer">
  <p>© 2026 LUXE BAG SHOP</p>
</footer>

<script src="js/script.js"></script>

<script>
function changeImage(img){
  document.getElementById("main-image").src = img.src;
}
</script>

</body>
</html>
